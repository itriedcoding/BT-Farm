name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: never

jobs:
  verify:
    name: Verify core and frontend
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck and build the frontend
        run: npm run build

      - name: Frontend unit tests
        run: npm test

      - name: Rust tests (platform independent core)
        run: cargo test -p farm-core --all-targets

  windows-installer:
    name: Build Windows installer
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build the frontend bundle
        run: npm run build

      # Compiles the desktop shell on its own so a Rust error shows up as a job
      # annotation instead of a bare "exit code 1" from the bundler step.
      - name: Compile the Rust shell
        shell: bash
        run: |
          set +e
          cargo build -p bt-farm --release > cargo-build.log 2>&1
          status=$?
          tail -n 40 cargo-build.log
          if [ "$status" -ne 0 ]; then
            short=$(grep -E '^error' cargo-build.log | head -n 6 | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')
            body=$(tail -c 3000 cargo-build.log | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Rust build failed::$short"
            echo "::error title=Rust build log tail::$body"
            {
              echo '### Rust build failed'
              echo '```'
              tail -n 60 cargo-build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$status"
          fi

      - name: Build the NSIS installer
        shell: bash
        run: |
          set +e
          npm run tauri -- build --bundles nsis > tauri-build.log 2>&1
          status=$?
          tail -n 40 tauri-build.log
          if [ "$status" -ne 0 ]; then
            body=$(tail -c 3000 tauri-build.log | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Installer build failed::$body"
            {
              echo '### Installer build failed'
              echo '```'
              tail -n 60 tauri-build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$status"
          fi

      - name: List the installer
        shell: bash
        run: |
          ls -la target/release/bundle/nsis 2>/dev/null || true
          ls -la src-tauri/target/release/bundle/nsis 2>/dev/null || true

      - name: Publish the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0
          name: BT Farm 1.2.0
          draft: false
          prerelease: false
          body: |
            BT Farm 1.2.0 — cloud infrastructure and Android device control plane for Windows.

            **Install**: download `BT Farm_1.2.0_x64-setup.exe` below and run it. The installer is
            per-user, needs no administrator rights, and uninstalls through Settings → Apps.

            **Requirements**
            - Windows 10 1809 or newer, x64. WebView2 is installed by the setup if it is missing.
            - Android platform-tools (`adb.exe`) for device features; ffmpeg is optional.

            **What is real in this build**
            - E2B, Boat, boxd, Daytona and Freestyle are called through their own APIs (boxd through
              its official CLI). Nothing is mocked, seeded or simulated.
            - Android devices are physical or network devices attached over ADB. None of the five
              providers can boot an Android emulator, so the app never presents an instance as a phone.
            - Live screens are PNG frames captured with `adb exec-out screencap -p` (1–15 fps).
            - Credentials are sealed with Windows DPAPI under your user account and never logged.

            The capability matrix, architecture notes and build instructions are in the README.
          files: |
            target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe
